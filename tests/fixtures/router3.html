<!doctype html><html lang="en"><head><meta charset="utf-8"><title>spa3</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.4 Arial,sans-serif}.route{display:none}.route.active{display:block}.hero{padding:60px 40px;min-height:500px}</style></head><body><div id="app"></div>
<script>var a=document.getElementById('app');['home','about','contact'].forEach(function(n,i){var d=document.createElement('div');d.className='route'+(i?'':' active');d.innerHTML='<section class="hero"><h1>Built '+n+' heading</h1><p>This route is created by a script, so without scripts the page is empty and the scripted path must be used.</p></section>';a.appendChild(d)})</script></body></html>
